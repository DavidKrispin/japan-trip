<!DOCTYPE html><html lang="he" dir="rtl"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>מקומות שמורים</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇯🇵</text></svg>"><link rel="stylesheet" href="/_astro/index.DBAVBTbX.css"></head> <body class="bg-gray-50 text-gray-900 min-h-screen font-sans"> <!-- Nav --> <nav class="bg-white border-b border-gray-200 sticky top-0 z-50"> <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between"> <a href="/" class="text-xl font-bold text-sakura-600 flex items-center gap-2">🇯🇵 הטיול שלנו</a> <div class="flex gap-3 text-sm"> <a href="/" class="hover:text-sakura-600">סקירה</a> <a href="/saved" class="hover:text-sakura-600">מקומות שמורים</a> <a href="/admin/trip" class="hover:text-sakura-600 text-gray-400">⚙️</a> </div> </div> </nav> <main class="max-w-5xl mx-auto px-4 py-6">  <div> <h1 class="text-2xl font-bold mb-6">⭐ מקומות שמורים</h1> <p class="text-gray-500 text-sm mb-6">המלצות ומקומות שווה ללכת אליהם — לא מקושרים ליום ספציפי</p> <div id="loading" class="text-center py-8 text-gray-400">טוען...</div> <div id="saved-list" class="hidden space-y-3"></div> <div id="empty" class="hidden text-center py-12 text-gray-400">אין מקומות שמורים. הוסיפו דרך ⚙️</div> </div> <script type="module">async function a(){try{const e=await fetch("/api/saved");if(!e.ok)throw new Error(e.status);const s=await e.json();n(s.places||[])}catch{document.getElementById("loading").textContent="שגיאה בטעינה"}}function n(e){if(document.getElementById("loading").classList.add("hidden"),e.length===0){document.getElementById("empty").classList.remove("hidden");return}const s=document.getElementById("saved-list");s.classList.remove("hidden"),s.innerHTML=e.map(t=>`
        <div class="p-4 bg-white rounded-xl shadow-sm border border-gray-100">
          <div class="flex items-start justify-between">
            <div>
              <h3 class="font-bold">${t.name}</h3>
              ${t.city?`<span class="text-xs text-gray-400">${t.city}</span>`:""}
              ${t.category?`<span class="text-xs bg-sakura-50 text-sakura-600 px-2 py-0.5 rounded-full mr-2">${t.category}</span>`:""}
              ${t.duration?`<span class="text-xs text-gray-400">⏱️ ${t.duration}</span>`:""}
            </div>
            <a href="https://www.google.com/maps/search/${encodeURIComponent(t.name+" "+(t.address||t.city||"Japan"))}" target="_blank" class="text-blue-500 text-sm hover:underline shrink-0">📍 מפה</a>
          </div>
          ${t.notes?`<p class="text-sm text-gray-500 mt-2">${t.notes}</p>`:""}
        </div>
      `).join("")}a();</script>  </main> <footer class="text-center text-xs text-gray-400 py-4">מתוכנן באהבה 🌸</footer> </body></html>
