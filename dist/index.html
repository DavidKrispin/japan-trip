<!DOCTYPE html><html lang="he" dir="rtl"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>הטיול שלנו ליפן 🇯🇵</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇯🇵</text></svg>"><link rel="stylesheet" href="/_astro/index.DBAVBTbX.css"></head> <body class="bg-gray-50 text-gray-900 min-h-screen font-sans"> <!-- Nav --> <nav class="bg-white border-b border-gray-200 sticky top-0 z-50"> <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between"> <a href="/" class="text-xl font-bold text-sakura-600 flex items-center gap-2">🇯🇵 הטיול שלנו</a> <div class="flex gap-3 text-sm"> <a href="/" class="hover:text-sakura-600">סקירה</a> <a href="/saved" class="hover:text-sakura-600">מקומות שמורים</a> <a href="/admin/trip" class="hover:text-sakura-600 text-gray-400">⚙️</a> </div> </div> </nav> <main class="max-w-5xl mx-auto px-4 py-6">  <div id="app"> <div id="loading" class="text-center py-12 text-gray-400">טוען...</div> <div id="content" class="hidden"> <!-- Trip header --> <div id="trip-header" class="mb-8 p-6 bg-white rounded-2xl shadow-sm border border-gray-100"> <h1 class="text-2xl font-bold mb-2" id="trip-name">הטיול שלנו ליפן</h1> <p class="text-gray-500 text-sm" id="trip-dates"></p> <div id="trip-regions" class="mt-3 flex flex-wrap gap-2"></div> </div> <!-- Timeline --> <h2 class="text-lg font-bold mb-4">📅 ימי הטיול</h2> <div id="days-list" class="space-y-3"></div> <!-- Empty state --> <div id="empty-state" class="hidden text-center py-12"> <p class="text-gray-400 text-lg mb-4">אין עדיין ימים בטיול</p> <a href="/admin/trip" class="px-4 py-2 bg-sakura-600 text-white rounded-lg hover:bg-sakura-700">צור טיול חדש</a> </div> </div> </div> <script type="module">const r="/api/trip";async function l(){try{const e=await fetch(r);if(!e.ok)throw new Error(e.status);const t=await e.json();o(t)}catch{const t=localStorage.getItem("trip-data");t?o(JSON.parse(t)):document.getElementById("loading").textContent="אין עדיין טיול. לכו ל-⚙️ כדי ליצור אחד."}}function o(e){if(document.getElementById("loading").classList.add("hidden"),document.getElementById("content").classList.remove("hidden"),!e||!e.trip){document.getElementById("empty-state").classList.remove("hidden");return}const t=e.trip;document.getElementById("trip-name").textContent=t.name||"הטיול שלנו ליפן",document.getElementById("trip-dates").textContent=t.startDate&&t.endDate?`${t.startDate} → ${t.endDate}`:"";const i=document.getElementById("trip-regions");t.regions&&t.regions.length&&(i.innerHTML=t.regions.map(n=>`<span class="px-3 py-1 bg-japan-100 text-japan-700 rounded-full text-xs font-medium">${n.name} (${n.days} ימים)</span>`).join(""));const s=e.days||[],d=document.getElementById("days-list");if(s.length===0){document.getElementById("empty-state").classList.remove("hidden");return}d.innerHTML=s.map((n,a)=>`
        <a href="/day/?id=${n.id}" class="block p-4 bg-white rounded-xl shadow-sm border border-gray-100 hover:border-sakura-200 hover:shadow-md transition-all">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-xs text-gray-400">יום ${a+1}</span>
              <h3 class="font-bold">${n.title||n.date||"יום "+(a+1)}</h3>
              <p class="text-sm text-gray-500">${n.city||""} ${n.hotel?"• 🏨 "+n.hotel:""}</p>
            </div>
            <div class="text-left">
              <span class="text-xs text-gray-400">${n.attractions?.length||0} אטרקציות</span>
            </div>
          </div>
        </a>
      `).join(""),localStorage.setItem("trip-data",JSON.stringify(e))}l();</script>  </main> <footer class="text-center text-xs text-gray-400 py-4">מתוכנן באהבה 🌸</footer> </body></html>
