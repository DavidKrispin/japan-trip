<!DOCTYPE html><html lang="he" dir="rtl"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>מקומות שמורים — ניהול</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇯🇵</text></svg>"><link rel="stylesheet" href="/_astro/index.DBAVBTbX.css"></head> <body class="bg-gray-50 text-gray-900 min-h-screen font-sans"> <!-- Nav --> <nav class="bg-white border-b border-gray-200 sticky top-0 z-50"> <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between"> <a href="/" class="text-xl font-bold text-sakura-600 flex items-center gap-2">🇯🇵 הטיול שלנו</a> <div class="flex gap-3 text-sm"> <a href="/" class="hover:text-sakura-600">סקירה</a> <a href="/saved" class="hover:text-sakura-600">מקומות שמורים</a> <a href="/admin/trip" class="hover:text-sakura-600 text-gray-400">⚙️</a> </div> </div> </nav> <main class="max-w-5xl mx-auto px-4 py-6">  <div> <a href="/admin/trip" class="text-sm text-sakura-600 hover:underline">← חזרה לניהול</a> <h1 class="text-2xl font-bold mt-2 mb-6">⭐ ניהול מקומות שמורים</h1> <div id="places-list" class="space-y-3 mb-6"></div> <form id="add-form" class="p-4 bg-white rounded-xl shadow-sm border border-gray-100 space-y-3"> <h3 class="font-bold text-sm">➕ הוסף מקום</h3> <div class="grid grid-cols-2 gap-3"> <input id="p-name" type="text" class="px-3 py-2 border rounded-lg text-sm" placeholder="שם המקום" required> <input id="p-city" type="text" class="px-3 py-2 border rounded-lg text-sm" placeholder="עיר"> </div> <div class="grid grid-cols-3 gap-3"> <input id="p-category" type="text" class="px-3 py-2 border rounded-lg text-sm" placeholder="קטגוריה (אוכל, טבע...)"> <input id="p-duration" type="text" class="px-3 py-2 border rounded-lg text-sm" placeholder="משך ביקור"> <input id="p-address" type="text" class="px-3 py-2 border rounded-lg text-sm" placeholder="כתובת"> </div> <textarea id="p-notes" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="הערות / המלצה"></textarea> <button type="submit" class="py-2 px-6 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700 text-sm">הוסף</button> </form> </div> <script type="module">let a=[];async function c(){try{const e=await fetch("/api/saved");e.ok&&(a=(await e.json()).places||[])}catch{}d()}function d(){const e=document.getElementById("places-list");e.innerHTML=a.map((t,n)=>`
        <div class="flex items-center justify-between p-3 bg-white rounded-lg border">
          <div>
            <span class="font-medium">${t.name}</span>
            <span class="text-xs text-gray-400 mr-2">${t.city||""} ${t.category?"• "+t.category:""}</span>
          </div>
          <button data-idx="${n}" class="remove-place text-red-400 hover:text-red-600 text-sm">🗑️</button>
        </div>
      `).join("")||'<p class="text-gray-400 text-sm">אין מקומות</p>',e.querySelectorAll(".remove-place").forEach(t=>{t.addEventListener("click",async()=>{const n=parseInt(t.dataset.idx);a.splice(n,1),await s(),d()})})}async function s(){await fetch("/api/saved",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({places:a})})}document.getElementById("add-form").addEventListener("submit",async e=>{e.preventDefault(),a.push({id:"place-"+Date.now(),name:document.getElementById("p-name").value,city:document.getElementById("p-city").value,category:document.getElementById("p-category").value,duration:document.getElementById("p-duration").value,address:document.getElementById("p-address").value,notes:document.getElementById("p-notes").value}),await s(),d(),document.getElementById("add-form").reset()});c();</script>  </main> <footer class="text-center text-xs text-gray-400 py-4">מתוכנן באהבה 🌸</footer> </body></html>
